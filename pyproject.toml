[project]
name = "alertmux"
version = "0.1.0"
description = "Multi-source natural-hazard alert normaliser"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]
mcp = ["mcp>=2,<3"]

[project.scripts]
alertmux-mcp = "alertmux.mcp_server:main"
alertmux-notify = "alertmux.notify.cli:main"
alertmux-dashboard = "alertmux.dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alertmux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints; excluded by default"]
addopts = "-m 'not live'"
